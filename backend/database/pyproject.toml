[project]
name = "legal-companion-database"
version = "0.1.0"
description = "Shared database access (SQLAlchemy) for API and backend modules"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q"]
