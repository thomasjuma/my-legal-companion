# Dependency manifest only — this directory is not an installable Python package.
# Run the app from this folder:  uv run uvicorn main:app
#   (or:  python -m uvicorn main:app  with the venv that has `database` installed)

[project]
name = "legal-companion-api-deps"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "openai-agents[litellm]>=0.14.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "legal-companion-database",
    "fastapi-clerk-auth>=0.0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
legal-companion-database = { path = "../database", editable = true }
